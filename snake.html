<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            font-family: 'Arial', sans-serif;
            color: white;
        }

        .container {
            text-align: center;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 0.5rem;
            color: #fff;
        }

        .subtitle {
            color: #94a3b8;
            margin-bottom: 2rem;
            font-size: 1rem;
        }

        .stats {
            display: flex;
            gap: 2rem;
            margin-bottom: 2rem;
            justify-content: center;
        }

        .stat-box {
            background: white;
            border-radius: 0.5rem;
            padding: 1.5rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            min-width: 150px;
        }

        .stat-label {
            color: #64748b;
            font-size: 0.875rem;
            margin-bottom: 0.5rem;
        }

        .stat-value {
            font-size: 2.25rem;
            font-weight: bold;
            color: #22c55e;
        }

        .stat-value.blue {
            color: #3b82f6;
        }

        canvas {
            background-color: #0f172a;
            border: 4px solid #22c55e;
            border-radius: 0.5rem;
            box-shadow: 0 20px 50px rgba(34, 197, 94, 0.3);
            display: block;
            margin: 2rem auto;
        }

        .button-group {
            margin-top: 2rem;
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            background-color: #22c55e;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        button:hover {
            background-color: #16a34a;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(34, 197, 94, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .instructions {
            margin-top: 2rem;
            background: rgba(148, 163, 184, 0.1);
            padding: 1.5rem;
            border-radius: 0.5rem;
            max-width: 500px;
            text-align: left;
            color: #cbd5e1;
            font-size: 0.9rem;
        }

        .instructions h3 {
            color: white;
            margin-bottom: 1rem;
            text-align: center;
        }

        .instructions li {
            list-style: none;
            margin-bottom: 0.5rem;
            padding-left: 1.5rem;
            position: relative;
        }

        .instructions li:before {
            content: "▸";
            position: absolute;
            left: 0;
            color: #22c55e;
        }

        .game-over {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            padding: 2rem;
            border-radius: 1rem;
            border: 3px solid #ef4444;
            text-align: center;
            z-index: 1000;
        }

        .game-over.show {
            display: block;
            animation: popIn 0.3s ease-out;
        }

        @keyframes popIn {
            from {
                transform: translate(-50%, -50%) scale(0.8);
                opacity: 0;
            }
            to {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
        }

        .game-over h2 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: #ef4444;
        }

        .game-over p {
            font-size: 1.25rem;
            margin-bottom: 1.5rem;
            color: #cbd5e1;
        }

        .game-over button {
            background-color: #3b82f6;
            padding: 0.75rem 2rem;
            font-size: 1.1rem;
        }

        .game-over button:hover {
            background-color: #2563eb;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🐍 Snake Game</h1>
        <p class="subtitle">Use arrow keys or WASD to move</p>

        <div class="stats">
            <div class="stat-box">
                <div class="stat-label">SCORE</div>
                <div class="stat-value" id="score">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">LENGTH</div>
                <div class="stat-value blue" id="length">1</div>
            </div>
        </div>

        <canvas id="gameCanvas" width="400" height="400"></canvas>

        <div class="button-group">
            <button id="startBtn" onclick="startGame()">🎮 Start Game</button>
            <button id="pauseBtn" onclick="togglePause()" style="display: none;">⏸️ Pause</button>
            <button id="resetBtn" onclick="resetGame()">🔄 Reset</button>
        </div>

        <div class="instructions">
            <h3>How to Play:</h3>
            <ul>
                <li>🔺 Use arrow keys or WASD to control the snake</li>
                <li>🍎 Eat red food to grow and gain points (+10)</li>
                <li>💀 Don't hit yourself (walls wrap around)</li>
                <li>🏆 Get the highest score you can!</li>
            </ul>
        </div>
    </div>

    <div class="game-over" id="gameOverModal">
        <h2>💀 Game Over!</h2>
        <p id="finalScore">Final Score: 0</p>
        <button onclick="startGame()">Play Again</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const GRID_SIZE = 20;
        const CELL_SIZE = canvas.width / GRID_SIZE;

        let snake = [{ x: 10, y: 10 }];
        let food = { x: 15, y: 15 };
        let direction = { x: 1, y: 0 };
        let nextDirection = { x: 1, y: 0 };
        let score = 0;
        let gameRunning = false;
        let gamePaused = false;
        let gameLoop = null;

        function drawCell(x, y, color) {
            ctx.fillStyle = color;
            ctx.fillRect(x * CELL_SIZE + 1, y * CELL_SIZE + 1, CELL_SIZE - 2, CELL_SIZE - 2);
        }

        function generateFood() {
            let newFood;
            let isOnSnake = true;

            while (isOnSnake) {
                newFood = {
                    x: Math.floor(Math.random() * GRID_SIZE),
                    y: Math.floor(Math.random() * GRID_SIZE)
                };
                isOnSnake = snake.some(segment => segment.x === newFood.x && segment.y === newFood.y);
            }

            return newFood;
        }

        function drawGame() {
            // Clear canvas
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw grid
            ctx.strokeStyle = 'rgba(100, 116, 139, 0.1)';
            ctx.lineWidth = 1;
            for (let i = 0; i <= GRID_SIZE; i++) {
                ctx.beginPath();
                ctx.moveTo(i * CELL_SIZE, 0);
                ctx.lineTo(i * CELL_SIZE, canvas.height);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(0, i * CELL_SIZE);
                ctx.lineTo(canvas.width, i * CELL_SIZE);
                ctx.stroke();
            }

            // Draw snake
            snake.forEach((segment, index) => {
                if (index === 0) {
                    drawCell(segment.x, segment.y, '#4ade80');
                    // Draw eyes on head
                    ctx.fillStyle = '#000';
                    const eyeOffset = CELL_SIZE / 6;
                    const eyeSize = CELL_SIZE / 8;
                    ctx.fillRect(segment.x * CELL_SIZE + eyeOffset, segment.y * CELL_SIZE + eyeOffset, eyeSize, eyeSize);
                    ctx.fillRect(segment.x * CELL_SIZE + CELL_SIZE - eyeOffset - eyeSize, segment.y * CELL_SIZE + eyeOffset, eyeSize, eyeSize);
                } else {
                    drawCell(segment.x, segment.y, '#22c55e');
                }
            });

            // Draw food
            ctx.fillStyle = '#ef4444';
            ctx.beginPath();
            ctx.arc(
                food.x * CELL_SIZE + CELL_SIZE / 2,
                food.y * CELL_SIZE + CELL_SIZE / 2,
                CELL_SIZE / 2 - 1,
                0,
                Math.PI * 2
            );
            ctx.fill();
        }

        function update() {
            direction = nextDirection;

            const head = snake[0];
            const newHead = {
                x: (head.x + direction.x + GRID_SIZE) % GRID_SIZE,
                y: (head.y + direction.y + GRID_SIZE) % GRID_SIZE
            };

            // Check collision with self
            if (snake.some(segment => segment.x === newHead.x && segment.y === newHead.y)) {
                endGame();
                return;
            }

            snake.unshift(newHead);

            // Check if food is eaten
            if (newHead.x === food.x && newHead.y === food.y) {
                score += 10;
                document.getElementById('score').textContent = score;
                document.getElementById('length').textContent = snake.length;
                food = generateFood();
            } else {
                snake.pop();
            }

            drawGame();
        }

        function startGame() {
            snake = [{ x: 10, y: 10 }];
            food = { x: 15, y: 15 };
            direction = { x: 1, y: 0 };
            nextDirection = { x: 1, y: 0 };
            score = 0;
            gamePaused = false;
            gameRunning = true;

            document.getElementById('score').textContent = score;
            document.getElementById('length').textContent = snake.length;
            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('pauseBtn').style.display = 'inline-block';
            document.getElementById('gameOverModal').classList.remove('show');

            drawGame();

            if (gameLoop) clearInterval(gameLoop);
            gameLoop = setInterval(() => {
                if (!gamePaused) update();
            }, 100);
        }

        function endGame() {
            gameRunning = false;
            clearInterval(gameLoop);
            document.getElementById('finalScore').textContent = `Final Score: ${score}`;
            document.getElementById('gameOverModal').classList.add('show');
            document.getElementById('startBtn').style.display = 'inline-block';
            document.getElementById('pauseBtn').style.display = 'none';
        }

        function togglePause() {
            if (!gameRunning) return;
            gamePaused = !gamePaused;
            document.getElementById('pauseBtn').textContent = gamePaused ? '▶️ Resume' : '⏸️ Pause';
        }

        function resetGame() {
            gameRunning = false;
            gamePaused = false;
            if (gameLoop) clearInterval(gameLoop);
            snake = [{ x: 10, y: 10 }];
            food = { x: 15, y: 15 };
            direction = { x: 1, y: 0 };
            nextDirection = { x: 1, y: 0 };
            score = 0;
            document.getElementById('score').textContent = score;
            document.getElementById('length').textContent = snake.length;
            document.getElementById('startBtn').style.display = 'inline-block';
            document.getElementById('pauseBtn').style.display = 'none';
            document.getElementById('gameOverModal').classList.remove('show');
            drawGame();
        }

        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            if (!gameRunning) return;

            switch (e.key.toLowerCase()) {
                case 'arrowup':
                case 'w':
                    e.preventDefault();
                    if (direction.y === 0) nextDirection = { x: 0, y: -1 };
                    break;
                case 'arrowdown':
                case 's':
                    e.preventDefault();
                    if (direction.y === 0) nextDirection = { x: 0, y: 1 };
                    break;
                case 'arrowleft':
                case 'a':
                    e.preventDefault();
                    if (direction.x === 0) nextDirection = { x: -1, y: 0 };
                    break;
                case 'arrowright':
                case 'd':
                    e.preventDefault();
                    if (direction.x === 0) nextDirection = { x: 1, y: 0 };
                    break;
            }
        });

        // Initial draw
        drawGame();
    </script>
</body>
</html>
